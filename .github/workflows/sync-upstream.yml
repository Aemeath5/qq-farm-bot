name: Sync upstream master
# Manual refresh trigger: 2026-11-22

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/liyangpengs/qq-farm-bot.git
          git fetch upstream master
          git checkout master
          git merge --no-edit upstream/master
          git push origin master
          echo "Merged source SHA: $(git rev-parse HEAD)"
          test -f web/src/views/Ranch.vue
          test -f web/src/views/RanchOverview.vue
