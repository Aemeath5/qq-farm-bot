name: Sync upstream master

# Manual sync trigger: 2026-09-11
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/liyangpengs/qq-farm-bot.git
          git fetch upstream master
          git checkout master
          git merge --no-edit upstream/master
          git push origin master
          echo "SYNCED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish merged image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./core/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/aemeath5/qq-farm-bot:latest
            ghcr.io/aemeath5/qq-farm-bot:${{ env.SYNCED_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
