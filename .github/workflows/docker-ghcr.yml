name: Build and publish Docker image

on:
  workflow_run:
    workflows:
      - Sync upstream master
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-master-publish
  cancel-in-progress: false

jobs:
  docker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest merged master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Resolve actual source revision
        id: revision
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -f web/src/views/Ranch.vue
          test -f web/src/views/RanchOverview.vue

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./core/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/aemeath5/qq-farm-bot:latest
            ghcr.io/aemeath5/qq-farm-bot:${{ steps.revision.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
